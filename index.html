
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Market - Online Shopping</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#17233b}
header{background:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:25px;font-weight:bold;color:#155eef}
.logo span{color:orange}
.search{display:flex;flex:1;min-width:180px}
input{padding:12px;border:1px solid #ddd;border-radius:8px;width:100%}
button{cursor:pointer;border:0;border-radius:8px;padding:11px 15px}
.search button{background:#155eef;color:white}
.cart{background:#eaf1ff;color:#155eef;font-weight:bold}
.hero{margin:20px;padding:35px;background:linear-gradient(120deg,#102a56,#246bce);color:white;border-radius:16px}
.hero h1{font-size:32px}
.hero button{background:white;color:#155eef;font-weight:bold}
main{max-width:1100px;margin:auto;padding:15px}
h2{margin-top:25px}
.categories{display:flex;gap:10px;overflow:auto}
.cat{background:white;border:1px solid #ddd;white-space:nowrap}
.cat.active{background:#155eef;color:white}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:white;border-radius:12px;overflow:hidden;padding-bottom:12px;box-shadow:0 2px 8px #0001}
.photo{height:130px;background:#eaf1ff;display:grid;place-items:center;font-size:55px}
.info{padding:12px}
.brand{font-size:12px;color:#777}
.name{font-weight:bold;margin:8px 0}
.price{color:#155eef;font-weight:bold;font-size:19px;margin:10px 0}
.add{background:#155eef;color:white;width:100%}
footer{background:#102a56;color:white;text-align:center;padding:25px;margin-top:35px}
.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.panel{background:white;border-radius:15px;padding:20px;width:100%;max-width:450px;max-height:85vh;overflow:auto}
.line{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ddd;gap:10px}
.qty button{background:#eaf1ff}
@media(max-width:700px){.products{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:25px}}
</style>
</head>
<body>

<header>
<div class="logo">MD <span>Market</span></div>
<form class="search" id="searchForm">
<input id="search" placeholder="পণ্য খুঁজুন...">
<button>Search</button>
</form>
<button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
<h1>স্বাগতম MD Market-এ</h1>
<p>বিভিন্ন কোম্পানির পণ্য কিনুন এক জায়গায়।</p>
<button onclick="document.getElementById('shop').scrollIntoView()">Shop Now</button>
</section>

<main id="shop">
<h2>পণ্যের ক্যাটাগরি</h2>
<div class="categories" id="categories"></div>

<h2>আমাদের পণ্য</h2>
<div class="products" id="products"></div>
</main>

<footer>
<h2>MD Market</h2>
<p>আপনার বিশ্বস্ত অনলাইন শপিং মার্কেট</p>
</footer>

<div class="modal" id="modal">
<div class="panel">
<h2>Shopping Cart</h2>
<button onclick="closeCart()">বন্ধ করুন ✕</button>
<div id="cartItems"></div>
<h3 id="total">মোট: ৳০</h3>
<button onclick="checkout()" style="background:green;color:white;width:100%">অর্ডারের সারাংশ</button>
</div>
</div>

<script>
const products=[
{id:1,brand:"Samsung",name:"Smart Watch",price:1250,cat:"Electronics",emoji:"⌚"},
{id:2,brand:"Nike",name:"T-Shirt",price:850,cat:"Fashion",emoji:"👕"},
{id:3,brand:"Sony",name:"Headphone",price:1500,cat:"Electronics",emoji:"🎧"},
{id:4,brand:"Beauty Care",name:"Skin Care",price:750,cat:"Cosmetics",emoji:"🧴"},
{id:5,brand:"MD Collection",name:"Bag",price:980,cat:"Fashion",emoji:"🎒"},
{id:6,brand:"Home Choice",name:"Table Lamp",price:650,cat:"Home",emoji:"💡"},
{id:7,brand:"Tech World",name:"Speaker",price:1100,cat:"Electronics",emoji:"🔊"},
{id:8,brand:"Daily Needs",name:"Water Bottle",price:280,cat:"Home",emoji:"🍼"}
];

let cart={};
let category="All";
const cats=["All",...new Set(products.map(p=>p.cat))];

function money(n){return "৳"+n.toLocaleString("en-IN")}

function showCategories(){
document.getElementById("categories").innerHTML=cats.map(c=>
`<button class="cat ${c===category?'active':''}" onclick="setCategory('${c}')">${c}</button>`
).join("");
}

function showProducts(){
let q=document.getElementById("search").value.toLowerCase();
let list=products.filter(p=>
(category==="All"||p.cat===category)&&
(p.name+" "+p.brand+" "+p.cat).toLowerCase().includes(q)
);
document.getElementById("products").innerHTML=list.length?list.map(p=>`
<div class="card">
<div class="photo">${p.emoji}</div>
<div class="info">
<div class="brand">${p.brand}</div>
<div class="name">${p.name}</div>
<div class="price">${money(p.price)}</div>
<button class="add" onclick="add(${p.id})">কার্টে যোগ করুন</button>
</div>
</div>`).join(""):"কোনো পণ্য পাওয়া যায়নি";
}

function setCategory(c){
category=c;showCategories();showProducts();
}

function add(id){
cart[id]=(cart[id]||0)+1;
updateCart();
}

function updateCart(){
let count=Object.values(cart).reduce((a,b)=>a+b,0);
document.getElementById("count").textContent=count;
let total=0;
let html="";
for(let id in cart){
let p=products.find(x=>x.id==id);
let qty=cart[id];
total+=p.price*qty;
html+=`<div class="line">
<div>${p.name}<br>${money(p.price)} × ${qty}</div>
<div class="qty">
<button onclick="change(${id},-1)">−</button>
${qty}
<button onclick="change(${id},1)">+</button>
</div></div>`;
}
document.getElementById("cartItems").innerHTML=html||"কার্ট খালি";
document.getElementById("total").textContent="মোট: "+money(total);
}

function change(id,n){
cart[id]=(cart[id]||0)+n;
if(cart[id]<=0)delete cart[id];
updateCart();
}

function openCart(){
updateCart();
document.getElementById("modal").classList.add("show");
}

function closeCart(){
document.getElementById("modal").classList.remove("show");
}

function checkout(){
if(!Object.keys(cart).length){
alert("আগে পণ্য কার্টে যোগ করুন");
return;
}
let message="আপনার অর্ডার:\\n";
let total=0;
for(let id in cart){
let p=products.find(x=>x.id==id);
message+=p.name+" × "+cart[id]+"\\n";
total+=p.price*cart[id];
}
message+="মোট: "+money(total);
alert(message);
}

document.getElementById("searchForm").addEventListener("submit",e=>{
e.preventDefault();showProducts();
});
document.getElementById("search").addEventListener("input",showProducts);

showCategories();
showProducts();
updateCart();
</script>
</body>
</html>
